version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      # --- Replaced Hardcoded Values with Variables from .env ---
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Ensure this port matches your DB_PORT in the .env file
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data: