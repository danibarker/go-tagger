<html>
  <head>
    <style>
      /* masonry columns */
      /* .pics {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: masonry;
      } */

      .masonry {
        --gutter: 0.25em;
        --flow-space: var(--gutter);
        --switcher-target-container-width: 28rem;
      }

      .masonry img {
        width: 100%;
        display: block;
        border-radius: 0.35rem;
      }

      .switcher {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gutter, 1em);
        align-items: var(--switcher-vertical-alignment, flex-start);
      }

      .switcher > * {
        flex-grow: 1;
        flex-basis: calc(
          (var(--switcher-target-container-width, 40rem) - 100%) * 999
        );
      }

      .flow > * + * {
        margin-block-start: var(--flow-space, 1em);
      }

      .wrapper {
        max-width: 80rem;
        margin-inline: auto;
        padding-inline: var(--gutter);
      }

      body {
        padding: 1em 0;
        background: #ffffff;
      }
    </style>
  </head>

    <script>
      const COLUMN_COUNT = 4;

      function getShortestColumnIndex(columnHeights) {
        let shortestIndex = 0;

        for (let index = 1; index < columnHeights.length; index += 1) {
          if (columnHeights[index] < columnHeights[shortestIndex]) {
            shortestIndex = index;
          }
        }

        return shortestIndex;
      }

      function estimateImageHeight(image, columnWidth) {
        const naturalWidth = image.naturalWidth || 1;
        const naturalHeight = image.naturalHeight || columnWidth;
        return (columnWidth * naturalHeight) / naturalWidth;
      }

      function renderMasonryDemo() {
        const container = document.getElementById("masonry-demo");
        const source = document.getElementById("masonry-source");

        if (!container || !source) {
          return;
        }

        const images = Array.from(source.querySelectorAll("img"));
        const gutter = parseFloat(
          getComputedStyle(container).getPropertyValue("--gutter") || "4",
        );
        const columnWidth = Math.max(
          1,
          (container.clientWidth - gutter * (COLUMN_COUNT - 1)) / COLUMN_COUNT,
        );
        const columnHeights = Array.from({ length: COLUMN_COUNT }, () => 0);
        const columns = Array.from({ length: COLUMN_COUNT }, () => {
          const column = document.createElement("div");
          column.className = "flow";
          return column;
        });

        container.replaceChildren(...columns);

        images.forEach((image) => {
          const columnIndex = getShortestColumnIndex(columnHeights);
          columns[columnIndex].appendChild(image);
          columnHeights[columnIndex] += estimateImageHeight(image, columnWidth);
        });
      }

      window.addEventListener("load", renderMasonryDemo);
      window.addEventListener("resize", renderMasonryDemo);
    </script>
